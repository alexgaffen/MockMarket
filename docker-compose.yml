services:
  cpp-algos:
    build: ./cpp-algos
    ports:
      - "8080:8080"
    networks:
      - investor-net

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # API keys come from your shell or a .env file next to this one; never commit them.
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Reach the C++ engine by its service name on the Compose network.
      - STRATEGY_SERVICE_URL=http://cpp-algos:8080/analyze
    depends_on:
      - cpp-algos
    networks:
      - investor-net

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    networks:
      - investor-net

networks:
  investor-net:
